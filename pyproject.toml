[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-mapper"
# Source of truth: codebase_mapper.constants.TOOL_VERSION. The contract
# test `pyproject_version_matches_tool_version` in tests/verify_drift_p1.py
# asserts these stay in lockstep. When bumping, update BOTH in the same commit.
version = "0.5.0"
description = "Map source code repositories into RDF graphs with a pluggable extension surface (chunks/embeddings, concept graph)."
readme = "README.md"
requires-python = ">=3.10"
# Pins on packages shared with the Docker requirements files must match them
# exactly — enforced by tests/verify_requirements_mirror.py (drift-risk H8),
# so pip/CI and the Docker images resolve the same world.
dependencies = [
    "rdflib>=7.0,<8.0",
    "pyshacl>=0.27",
    "tree-sitter",
    "tree-sitter-c",
    # CFML tag + cfscript grammars (cfmleditor/tree-sitter-cfml). Imported
    # module-locally by languages/cfml.py — NOT via ts_setup's shared import
    # block — so its absence degrades only CFML files.
    "tree-sitter-cfml",
    "tree-sitter-cpp",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-objc",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-typescript",
    "numpy>=2.0,<3.0",
    "sentence-transformers>=3.0,<6.0",
    # Rust-backed RDF engine for inventory serialization: 67M triples
    # (torvalds/linux) serialize to Turtle in ~40 s / ~24 GB vs tens of
    # minutes / >100 GB via rdflib alone. emit() degrades gracefully to
    # rdflib when absent, but at kernel scale this is not optional.
    "pyoxigraph",
    "pyyaml",
    "tomli; python_version < '3.11'",
]

[project.scripts]
codebase-mapper = "codebase_mapper.cli:main"

[project.optional-dependencies]
# Frontend (FastAPI backend + read-only MCP server) runtime dependencies.
# Single source of truth: mirrors frontend/backend/requirements.txt and
# frontend/mcp_server/requirements.txt (the Docker images install those
# directly). Declared here so `pip install -e ".[frontend]"` — and the drift
# / repository-summary verifiers that import `frontend.mcp_server` — resolve
# without a ModuleNotFoundError.
frontend = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "mcp>=1.27,<2.0",
    "PyJWT>=2.8,<3.0",
    "httpx>=0.28,<1.0",
    # Rust-backed store for the sparql tool; without it the tool falls
    # back to an rdflib parse that cannot fit the 10 s dispatch budget
    # on large bundles.
    "pyoxigraph>=0.5,<1.0",
]
# `dev` pulls in `frontend` so the full offline verifier suite (which imports
# the FastAPI/MCP layer) runs after a plain `make install`.
dev = [
    "import-linter",
    "mypy",
    "types-PyYAML",
    # tests/verify_report_spec.py validates the reporting contract schema.
    "jsonschema",
    # The Makefile's test targets invoke `pytest ... --no-cov`; both must be
    # declared or a lock-driven `uv sync` strips them and `make test` breaks.
    "pytest",
    "pytest-cov",
    # scripts/report_to_pdf.py's renderer; declared here so
    # tests/test_report_to_pdf.py runs instead of importorskip-skipping.
    "weasyprint",
    "codebase-mapper[frontend]",
]
site = [
    "markdown-it-py",
    "Pygments",
]
# A4 PDF dossier renderer (scripts/cbm_dossier.py, on top of scripts/cbm_report.py).
dossier = [
    "reportlab",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codebase_mapper*", "plugins*", "decomposer*", "recomposer*"]
exclude = ["tests*", "scripts*"]

[tool.mypy]
# Executed contract for the repo's Python type annotations (`python -m mypy`,
# gated in CI). The TS region already compiles under `strict`; this closes the
# annotated-but-unenforced gap on the Python side. Scope: the shipped library
# (codebase_mapper, plugins) plus both frontend service surfaces.
files = [
    "codebase_mapper",
    "plugins",
    "frontend/backend/app.py",
    "frontend/backend/serving",
    "frontend/mcp_server",
]
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    "frontend/mcp_server/tests/",
]

[[tool.mypy.overrides]]
# app.py deliberately imports its serving layer twice (package-relative,
# then script-mode `import app` fallback for the test surface); every name
# in the fallback branch re-binds the same symbol, which is the point.
module = "frontend.backend.app"
disable_error_code = ["no-redef"]

[tool.importlinter]
root_package = "codebase_mapper"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared-kernel-stays-independent"
type = "forbidden"
source_modules = ["codebase_mapper.shared_kernel"]
forbidden_modules = [
    "codebase_mapper.inspection",
    "codebase_mapper.emission",
]
ignore_imports = [
    "codebase_mapper.shared_kernel.extensions -> codebase_mapper.inspection.models",
    "codebase_mapper.shared_kernel.extensions -> codebase_mapper.inspection._builtins",
]

[[tool.importlinter.contracts]]
name = "inspection-domain-ports-stay-out-of-emission"
type = "forbidden"
source_modules = ["codebase_mapper.inspection.domain"]
forbidden_modules = ["codebase_mapper.emission"]

[[tool.importlinter.contracts]]
name = "emission-domain-ports-stay-out-of-infrastructure"
type = "forbidden"
source_modules = ["codebase_mapper.emission.domain"]
forbidden_modules = ["codebase_mapper.emission.infrastructure"]

[[tool.importlinter.contracts]]
name = "inspection-domain-does-not-import-emission-domain"
type = "forbidden"
source_modules = ["codebase_mapper.inspection.domain"]
forbidden_modules = ["codebase_mapper.emission.domain"]

[[tool.importlinter.contracts]]
name = "emission-domain-does-not-import-inspection-domain"
type = "forbidden"
source_modules = ["codebase_mapper.emission.domain"]
forbidden_modules = ["codebase_mapper.inspection.domain"]

[[tool.importlinter.contracts]]
name = "domain-ports-avoid-framework-imports"
type = "forbidden"
source_modules = ["codebase_mapper.emission.domain"]
forbidden_modules = [
    "click",
    "flask",
    "rdflib",
    "yaml",
]

[tool.pytest.ini_options]
# Repo-root imports (`import scripts.run_l4`) work regardless of invocation dir.
pythonpath = ["."]
