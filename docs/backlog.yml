  - id: "BL-011"
    title: "Rewire dossier UML views to consume the bundle graph"
    summary: "Make the cbm_dossier UML sections query the RDF bundle instead of re-parsing Python blobs at render time."
    description: |
      Refined 2026-07-11 (verification pass): the re-parse holdout is
      exactly one view — UMLClassTreeRL. Its data build opens blobs/ and
      re-parses with pyast at render time (scripts/cbm_dossier.py:1630-1709;
      parse loop :1639-1659), Python-only and main-package-only (:1640),
      public methods only (:1653), keyed by bare class name so duplicates
      silently overwrite (:1659) — ignoring cbml2 signatures,
      cbml2:baseType, the cbmxr xref layer, and the new cbml2:memberOf /
      cbml2:qualifiedSymbol facts (BL-002, done). The other UML views are
      already wired correctly: packages/object/composite query the RDF graph;
      component/activity read the decomposition YAML sidecar. Rewiring the
      class view onto the graph extends it to every resolver-covered
      language and makes the remaining data gaps (BL-003..BL-007) visible as
      explicit empty query results rather than silent omissions. External
      bases and unresolved references should render as disclosed gaps,
      consistent with the report disclaimer framing.
    category: "tooling"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "The class-diagram view — the one that needs the new structural facts — is the only UML view bypassing the graph."
    acceptance_criteria:
