  - id: "BL-006"
    title: "Emit abstract, static, and final modifiers as chunk facts"
    summary: "Surface abstract/static/final as boolean chunk predicates instead of leaving them inside the raw signature string."
    description: |
      cbml2:visibility and cbml2:isAsync exist as predicates, but abstract,
      static, and final live only inside the cbml2:signature text, so a UML
      renderer must re-parse strings to apply the italics (abstract) and
      underline (static) conventions. Verified 2026-07-11: no analyzer
      stores them structurally — Java's _modifier_info yields only
      visibility and decorators (java.py:83); Dart captures a mods regex
      group but uses it only to detect factory constructors (dart.py:636,
      :662); Rust's "static" is a declaration kind, not a modifier
      (rust.py:66). All three are parse-certain keywords in the languages
      that have them. Extend the signature contract, the graph writer, and
      shapes; extract per analyzer where the keyword exists, honoring the
      omission contract.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "S"
    priority: "medium"
    rationale: "Renderers must re-parse signature strings to recover modifiers UML notates as italics and underline."
    acceptance_criteria:
      - "An abstract method and a static method in a Java fixture carry the new predicates."
      - "Predicates are absent when the keyword is absent in source (omission contract)."
    references:
      - "plugins/chunks_embeddings/signatures.py:1-45"
      - "plugins/chunks_embeddings/graph_writer.py:63-77"
      - "codebase_mapper/inspection/languages/java.py:83"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "modifiers", "signature-contract"]

  - id: "BL-007"
    title: "Preserve declaration-kind stereotypes in chunk kinds"
    summary: "Stop flattening interface, struct, enum, protocol, object, and module declarations to kind class so UML stereotypes survive."
    description: |
      Refined 2026-07-11 (verification pass) — the flattening happens at TWO
      layers, so fixing analyzers alone is insufficient:

      1. Analyzers: Kotlin maps interface/object to "class" (kotlin.py:193),
         Swift maps struct/enum/protocol to "class" (swift.py:177), Ruby
         maps module to "class" (ruby.py:153). Java (java.py:238-242) and
         Rust (rust.py:58-61) preserve real kinds at the item layer.
      2. Chunker: per-language _*_TO_CHUNK_KIND maps re-flatten EVERYTHING
         structural to "class" — Java's preserved
         interface/enum/annotation/record kinds never survive into chunks
         (chunker.py:1122-1130), and the Rust chunker hardcodes "class" for
         struct/enum/union/trait (chunker.py:688+). So no language reaches
         the graph with stereotype fidelity today.

      The source keyword survives as free text inside cbml2:signature, so
      the fix is structuring data that already exists. Constraints: the
      SHACL sh:in closure on CHUNK_KINDS
      (plugins/chunks_embeddings/graph_writer.py:60) must widen; the
      MUST-level clause C2.9.3 in docs/SPEC_FIRST_CLASS_LANGUAGE.md fixes a
      five-kind vocabulary (with "module", without the rest) and must be
      amended in the same change; the Clojure chunker already leaks a
      nonconforming kind "var" (chunker.py:1250-1256) to reconcile.
      Recommended shape: keep "class" as the shape-parity kind and add a
      cbml2:declarationKind predicate carrying the source construct.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "Stereotype fidelity is lost for every language at the chunk layer; interface/enum/protocol boxes cannot be labeled by query."
    acceptance_criteria:
      - "A Swift protocol, a Kotlin interface, and a Java interface in fixtures are distinguishable from concrete classes by graph query."
      - "SPEC_FIRST_CLASS_LANGUAGE.md C2.9.3 amended in the same change; SHACL shapes and golden updated; Clojure var kind reconciled."
      - "Existing consumers of chunk kind are unaffected or migrated in the same change."
    references:
      - "codebase_mapper/inspection/languages/kotlin.py:193"
      - "codebase_mapper/inspection/languages/swift.py:177"
      - "codebase_mapper/inspection/languages/ruby.py:153"
      - "codebase_mapper/inspection/languages/java.py:238-242"
      - "plugins/chunks_embeddings/chunker.py:1122-1130"
      - "plugins/chunks_embeddings/graph_writer.py:60"
      - "docs/SPEC_FIRST_CLASS_LANGUAGE.md"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "stereotypes", "chunk-kinds"]

  - id: "BL-008"
    title: "Close the xref resolver registry gap for six languages"
    summary: "Add symbol xref resolvers for go, kotlin, swift, ruby, clojure, and c so resolved inheritance and call edges exist beyond the current eight languages."
    description: |
      The resolver registry (plugins/symbol_xrefs/__init__.py:56-67) covers
      cobol, cpp, dart, java, objc, python, rust, and ts/js. Go, Kotlin,
      Swift, Ruby, Clojure, and C analyzers already produce items and bases
      literals (go.py:125-128 interface embeds, kotlin.py:144-158,
      swift.py:137-142, ruby.py:112-133 superclass plus include) but no
      resolved subclassOf or calls edges are ever emitted for them. One
      resolver module per language following the existing registry pattern;
      each language is an independently shippable increment.

      Refined 2026-07-11: this item is the resolver slice of the Tier-1
      promotion pipeline in docs/SPEC_FIRST_CLASS_LANGUAGE.md sections
      2.10-2.11 (which also mandates a verify_<lang>_xrefs.py per language);
      no conflict — the spec's promotion table does not list these six.
    category: "feature"
    type: "feature"
    status: "ready"
