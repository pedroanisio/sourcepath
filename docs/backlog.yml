  - id: "BL-064"
    title: "The backlog schema's decision-reference fields have no backing registry"
    summary: "metadata.decision_prefix and items[].related_decisions (D-NNN) exist in the schema, but no decisions file or ADR system backs them anywhere in the repo."
    description: |
      docs/schema/backlog.schema.json declares a decision_prefix ("D") and a
      related_decisions array (pattern ^D-[0-9]{3}$) for backlog items to
      cite design decisions by. No file in this repository defines a D-NNN
      decision, and no engineering_decisions.yml or ADR directory exists to
      hold one — the schema promises traceability to a decisions registry
      that was never built. This is the same "declared but unbacked
      contract" pattern as BL-054's disclaimer-frontmatter gap, just in the
      backlog's own governance layer. The fix is a genuine either/or: build
      a minimal decisions registry (even a single decisions.yml with
      id/title/rationale/date), or remove the unused
      decision_prefix/related_decisions schema surface so the schema stops
      promising something no item can ever cite.
    category: "docs"
    type: "infra"
    status: "ready"
    complexity: "S"
    priority: "medium"
    rationale: "A schema field that can never be populated is a governance contract nobody can keep; every backlog item implicitly under-cites its own rationale trail until this is resolved one way or the other."
    acceptance_criteria:
      - "Either a minimal decisions registry exists and at least one item's related_decisions resolves against it, or decision_prefix/related_decisions are removed from the schema and every referencing doc."
    references:
      - "docs/schema/backlog.schema.json:14,22,51"
      - "docs/backlog.yml:28"
    owner: "unassigned"
    source: "sourcepath-prompts/docs/prompt-consume-roadmap.md, section 0.3 ('There is no ADR/engineering_decisions.yml system of record... the backlog schema's related_decisions field points at a D-NNN prefix that has no backing file yet'), re-verified 2026-07-11: no decisions/ADR file found anywhere in the repo."
    tags: ["backlog", "governance", "documentation-truth"]

  - id: "BL-065"
    title: "No automated FLAM reader or enforcer exists — rules are convention-only"
    summary: "Five scripts declare __file_meta__ rules blocks per CLAUDE.md's FLAM contract, but there is no lib.meta_reader-style tool and no general enforcement; only one of the five has a dedicated pinning test."
    description: |
      CLAUDE.md's File-Level Agent Metadata (FLAM) section describes a real
      contract: respect status (frozen/deprecated), honour every rules
      entry, and — "if the project includes FLAM tooling" — run
      `python -m lib.meta_reader <file>`. This repository has no such tool:
      no lib/meta_reader.py or equivalent exists anywhere in the tree. Five
      scripts (scripts/cbm_cartogram.py, scripts/cbm_report_rs.py,
      scripts/generate_static_site.py, scripts/report_to_pdf.py,
      scripts/setup_and_validate_ontology.py) carry real __file_meta__
      blocks with severity-tagged rules, and only one of those five
      (report_to_pdf.py's keep-disclaimer rule) is mechanically pinned, by a
      dedicated test (tests/test_report_to_pdf.py). The other four scripts'
      rules are enforced by nothing but the convention of an agent reading
      the block before editing.
    category: "tooling"
    type: "tech-debt"
    status: "ready"
    complexity: "S"
    priority: "medium"
    rationale: "A metadata contract enforced only by an agent choosing to read it, rather than by a mechanical gate, is exactly the 'declared but not enforced' failure mode this project's own drift guards exist to close everywhere else (BL-025, BL-054, BL-055)."
    acceptance_criteria:
      - "A general FLAM reader (or a generic pytest walk over every __file_meta__ block) verifies severity: error rules for all five carrying scripts, not just report_to_pdf.py."
      - "Adding a new __file_meta__ block to a script is covered by the same generic check without a bespoke test per file."
    references:
      - "CLAUDE.md (File-Level Agent Metadata / FLAM section)"
      - "scripts/cbm_cartogram.py"
      - "scripts/cbm_report_rs.py"
      - "scripts/generate_static_site.py"
      - "scripts/report_to_pdf.py"
      - "scripts/setup_and_validate_ontology.py"
      - "tests/test_report_to_pdf.py"
    owner: "unassigned"
    source: "sourcepath-prompts/docs/prompt-consume-roadmap.md, section 0.5, re-verified 2026-07-11: no lib/meta_reader (or equivalent) found in the repo; only one of five __file_meta__-bearing scripts has a dedicated pinning test."
    tags: ["flam", "governance", "tooling", "tech-debt"]

  # ===================================================================
  # LLVM-lessons architecture audit (BL-066..BL-067)
  # Grounded in a conversational review of what codebase_mapper's own
  # extension-registry and vocabulary design could learn from LLVM's
  # PassManager and TableGen conventions (2026-07-11). Both re-verified
  # directly against the live source before registration.
  # ===================================================================

  - id: "BL-066"
    title: "Extension registries order by name-sort alone, with no dependency declaration"
    summary: "Every one of the 7 extension protocols is scheduled by sorted(key=lambda x: x.name); nothing declares or checks that L2 must run before L3, so a rename can silently break the invariant."
    description: |
      codebase_mapper/shared_kernel/extensions.py:138-162 orders every
      registry (LanguageAnalyzer, ImportResolver, RecordEnricher,
      Aggregator, GraphContributor, ShapeContributor, ArtifactEmitter)
      purely by sorted(key=lambda x: x.name) — there is no requires/
      provides/invalidates concept anywhere in the module (zero grep
      hits). The L2-before-L3 invariant ("L3's concept aggregator reads
      L2's chunk index at ctx.indices") holds only because plugin authors
      remember to prefix names l2_20_embeddings / l3_20_concepts; nothing
      catches a rename or a new plugin that silently violates the order.
      LLVM's PassManager solved exactly this with getAnalysisUsage():
      each pass declares what it requires, preserves, and invalidates,
      and the manager resolves order (and can reject an unsatisfiable
      dependency) instead of relying on a naming convention.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "An implicit, string-based ordering convention with no check is a latent correctness risk: a plugin rename or a new plugin with an unlucky name can silently reorder execution and break a cross-layer read with no test failing."
    acceptance_criteria:
      - "Each of the 7 extension protocols supports an optional explicit dependency declaration (e.g. requires/provides on registration) alongside the existing name."
      - "iter_* registry functions resolve order from declared dependencies where present, and raise on a detected cyclic or unsatisfiable dependency rather than silently falling back to name-sort."
      - "A test demonstrates that reordering plugin names without updating a dependency declaration is caught, not silently accepted."
    references:
      - "codebase_mapper/shared_kernel/extensions.py:42-163"
      - "codebase_mapper/shared_kernel/extensions.py:138-162"
    owner: "unassigned"
    source: "LLVM-domain architecture-lessons conversation, 2026-07-11 (LLVM PassManager's getAnalysisUsage vs. this repo's name-sort scheduling), re-verified: extensions.py's iter_* functions are confirmed sorted(key=lambda x: x.name) with zero requires/invalidates/provides references in the file."
    tags: ["architecture", "extensions", "plugins", "llvm-lessons"]

  - id: "BL-067"
    title: "Controlled vocabularies are declared twice and drift-tested, not generated from one source"
    summary: "FileType/Phase are declared independently in shared_kernel/vocabulary.py and the Pydantic inventory schema, kept in sync only by a drift test — the same duplicate-then-detect pattern as BL-063, applied to the core vocabulary."
    description: |
      tests/test_inventory_schema.py::test_vocabularies_match_constants
      exists specifically because FileType and Phase are declared twice:
      once as RDF controlled-vocabulary terms in
      codebase_mapper/shared_kernel/vocabulary.py, and again as Pydantic
      enums in codebase_mapper/emission/domain/inventory_schema.py. A test
      catches divergence after the fact; nothing prevents it structurally.
      LLVM's TableGen convention takes the opposite approach for its own
      instruction/intrinsic/attribute tables: declare the facts once, and
      generate every consumer (enum, switch, docs) from that single
      table, so drift is structurally impossible rather than merely
      detected. BL-063 already tracks this exact class of problem for the
      L4 enrichment record shape; this item is the same pattern applied to
      the core FileType/Phase vocabulary.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "A drift test is a detection mechanism, not a prevention mechanism; declaring a controlled vocabulary exactly once and generating (or directly importing) every consumer from it eliminates the class of bug BL-063 and this item both currently only guard against after the fact."
    acceptance_criteria:
      - "FileType and Phase have exactly one authored declaration; the RDF vocabulary terms and the Pydantic enum are both derived from it (by direct import or codegen), not independently declared."
      - "test_vocabularies_match_constants is either removed as structurally unnecessary or reduced to a triviality check, since the two can no longer diverge by construction."
    references:
      - "codebase_mapper/shared_kernel/vocabulary.py"
      - "codebase_mapper/emission/domain/inventory_schema.py"
      - "tests/test_inventory_schema.py:96"
    owner: "unassigned"
    source: "LLVM-domain architecture-lessons conversation, 2026-07-11 (TableGen single-source-of-truth codegen vs. declare-twice-and-drift-test), re-verified: test_vocabularies_match_constants exists at tests/test_inventory_schema.py:96 precisely because the two declarations are independent. Same class of problem as BL-063, applied to a different pair."
    tags: ["architecture", "vocabulary", "drift", "llvm-lessons"]

  # ===================================================================
  # Backlog tooling (BL-068)
  # ===================================================================

  - id: "BL-068"
    title: "Add a --stats mode to the backlog governance script"
    summary: "check-backlog-governance.mjs had no way to summarize the backlog (counts by status/priority/complexity/category/type/owner, cross-tabs including category/type by status, weighted remaining-work size); the only way to get those numbers was an ad hoc one-off script."
    description: |
      Operators had no CLI to answer "how much of the backlog is left, and
      how urgent is it" beyond hand-counting rows in docs/BACKLOG.md. Added
      computeStats()/formatStats() to scripts/check-backlog-governance.mjs
      and a `--stats` CLI flag (the default, argument-less invocation is
      unchanged and still only validates). Covered by a new TDD test suite
      (scripts/tests/check-backlog-governance.test.mjs, run via `node --test`
      or `make test-backlog-governance`, wired into the `test` aggregate and
      into .github/workflows/backlog-governance.yml).

      Amendment (2026-07-12): the operator asked whether --stats would work
      against a sibling repo's own backlog.yml (/home/admin/codebases/doc-ray).
      It didn't — two real defects, found by actually running it rather than
      assuming: (1) path resolution used path.join(rootDir, pathArg), and
      join() does not special-case an absolute second argument, so an
      absolute path concatenated into a broken, nonexistent path (ENOENT);
      (2) --stats called run(), which enforces this repo's own strict
      validate() (id_prefix, decision_prefix, six enum-vocabulary lists) —
      doc-ray's backlog.yml has none of those fields (a differently-shaped,
      independently-governed schema) and failed with 260 validation errors,
      so --stats never reached the point of printing anything. Fixed both:
      path construction now uses path.resolve() (which does treat an absolute
      argument as an override), and --stats now calls parseBacklog() directly
      instead of run(), since a read-only summary shouldn't require a foreign
      project's backlog to conform to this repo's own governance schema.
      Default (non-stats) mode is unchanged and still enforces full
      validation. Two new tests lock this in with a hermetic foreign-schema
      fixture (no dependency on doc-ray actually existing on the test
      machine).

      Amendment (2026-07-12, same day): operator asked for a category/type
      breakdown by status, not just status x priority. Added a generic
      buildCrossTab(items, rowField, colField) and renderCrossTab() (STATUS
      columns, rows sorted by total count descending, a per-row total
      column), reused for two new sections — CATEGORY x STATUS and
      TYPE x STATUS — alongside the existing status x priority cross-tab.
      Fixed an alignment regression the refactor introduced (row-label
      column width for the status x priority table) before it shipped.
    category: "tooling"
    type: "feature"
    status: "done"
    complexity: "S"
    priority: "medium"
    rationale: "A backlog with no summary view is hard to prioritize from at a glance; this reuses the script's existing hand-rolled YAML parser rather than adding a dependency or a second tool. A stats command that only works on this one repo's own backlog is a much narrower tool than one that works on any backlog.yml, and the gap was concrete and cheap to close once found."
    acceptance_criteria:
      - "node scripts/check-backlog-governance.mjs --stats prints status/priority/complexity/category/type/owner breakdowns, a status x priority cross-tab, and a complexity-weighted remaining-work percentage."
      - "The default (no --stats) invocation's output and exit behavior are unchanged."
      - "A test suite covers computeStats/formatStats and both CLI modes, wired to a make target."
      - "--stats accepts an absolute path to a backlog.yml outside this repo and prints its stats even when that file doesn't satisfy this repo's own governance schema (no id_prefix/decision_prefix/enum-vocabulary lists)."
      - "The default (validating) mode still rejects a schema-incompatible backlog rather than silently accepting it."
      - "--stats prints a CATEGORY x STATUS and a TYPE x STATUS cross-tab, each row-totaled, alongside the existing status x priority cross-tab."
    evidence_checks:
      - kind: "file-exists"
        path: "scripts/tests/check-backlog-governance.test.mjs"
      - kind: "grep"
        path: "scripts/check-backlog-governance.mjs"
        pattern: "wantsStats"
      - kind: "grep"
        path: "scripts/check-backlog-governance.mjs"
        pattern: 'resolve\(rootDir, backlogPath\)'
      - kind: "grep"
        path: "scripts/check-backlog-governance.mjs"
        pattern: "categoryByStatus"
      - kind: "grep"
        path: "scripts/check-backlog-governance.mjs"
        pattern: "typeByStatus"
      - kind: "grep"
        path: "Makefile"
        pattern: "test-backlog-governance"
      - kind: "grep"
        path: ".github/workflows/backlog-governance.yml"
        pattern: "node --test scripts/tests"
      - kind: "grep"
        path: "scripts/tests/check-backlog-governance.test.mjs"
        pattern: "absolute path to a backlog outside this repo"
      - kind: "grep"
        path: "scripts/tests/check-backlog-governance.test.mjs"
        pattern: "category-by-status cross-tab"
    references:
      - "scripts/check-backlog-governance.mjs"
      - "scripts/tests/check-backlog-governance.test.mjs"
      - "Makefile"
      - ".github/workflows/backlog-governance.yml"
      - "AGENTS.md"
      - "docs/BACKLOG.md"
    owner: "mine"
    source: "Direct operator request, 2026-07-12: 'do we have an option to output the full statistics of the complete backlog?' — built as a --stats flag on the existing governance script (operator's chosen option 1 of 2). Amended same day after the operator asked whether it would also work against /home/admin/codebases/doc-ray/docs/backlog.yml — it did not, for two verified reasons (absolute-path join bug; --stats required this repo's own strict schema) — both fixed and test-covered."
    tags: ["backlog", "tooling", "governance"]

  # ===================================================================
  # Python-fundamentals coverage audit (BL-069..BL-070)
  # Grounded in the python-fundamentals skill's solid/glossary-only/absent
  # coverage-ceiling lens, applied to codebase_mapper's own Python analyzer
  # rather than to the reference textbook it was built from (2026-07-12).
  # ===================================================================

  - id: "BL-069"
    title: "Generator functions get no distinct tag in the Python AST summary"
    summary: "def f(): yield x is captured identically to any other function — no is_generator (or similar) field exists anywhere in the Python signature schema."
    description: |
      codebase_mapper/inspection/languages/python.py and
      plugins/chunks_embeddings/signatures.py have zero references to
      yield/generator/is_generator (verified by direct grep — the only
      "yield" hits are the English word in unrelated docstrings/comments,
      e.g. "simply yield an empty dict"). tests/test_signatures_python.py
      explicitly tests decorators, async functions, positional-only params,
      and PEP 695 generics, but never a generator function. A consumer
      cannot query "which functions in this repo are generators" — they
      look identical to ordinary functions in the emitted graph.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "S"
    priority: "low"
    rationale: "Generators are a real, named Python construct with distinct runtime semantics (lazy iteration, statefulness) that the current signature schema has no way to express, unlike async (already tracked via is_async)."
    acceptance_criteria:
      - "The Python signature schema gains an is_generator (or equivalent) field, set when the function body contains a yield/yield-from at the top level."
      - "tests/test_signatures_python.py covers at least one generator function and one generator that is also async (async def with yield)."
    references:
      - "codebase_mapper/inspection/languages/python.py"
      - "plugins/chunks_embeddings/signatures.py:44,105,124"
      - "tests/test_signatures_python.py"
    owner: "unassigned"
    source: "python-fundamentals skill coverage-ceiling audit of codebase_mapper's own Python analyzer, 2026-07-12 — re-verified by direct grep across the analyzer, signature schema, and test file (zero hits for generator-awareness in any of the three)."
    tags: ["python", "signatures", "extraction"]

  - id: "BL-070"
    title: "Operator-overloading dunder methods have no protocol-level tag"
    summary: "__add__, __eq__, __radd__, etc. are captured as ordinary methods; nothing in the data model distinguishes a method that overloads an operator from any other method."
    description: |
      Zero hits for dunder/operator-overload handling anywhere across
      codebase_mapper/inspection/languages/python.py,
      plugins/chunks_embeddings/signatures.py, or
      plugins/symbol_xrefs/python_resolver.py. A class implementing
      operator overloading (Python's own curriculum devotes a full,
      dedicated chapter to this — "Operator Overloading") is
      indistinguishable, in the emitted graph, from a class with an
      ordinary method that happens to be named "__add__". There is no way
      to query "which classes in this repo overload arithmetic/comparison
      operators" or which specific operator/protocol a given dunder
      implements.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "S"
    priority: "low"
    rationale: "This is a named, well-defined Python protocol (the data model), not an incidental naming convention; recognizing it costs a lookup table (dunder name -> operator/protocol) and a tag on the existing method fact, not a new extraction pass."
    acceptance_criteria:
      - "A method whose name matches a known operator-protocol dunder (__add__, __radd__, __sub__, __eq__, __lt__, __len__, __getitem__, etc.) is tagged with the operator/protocol it implements."
      - "A test covers at least one overloaded arithmetic operator and one overloaded comparison operator on the same class."
    references:
      - "codebase_mapper/inspection/languages/python.py"
      - "plugins/chunks_embeddings/signatures.py"
      - "plugins/symbol_xrefs/python_resolver.py"
    owner: "unassigned"
    source: "python-fundamentals skill coverage-ceiling audit of codebase_mapper's own Python analyzer, 2026-07-12 — re-verified by direct grep across the analyzer, signature schema, and xref resolver (zero hits for dunder/operator-overload awareness in any of the three). Related: BL-047 (Python has no dedicated per-language verifier at all) — this finding is about missing extraction capability, a prerequisite to any such verifier covering it."
    tags: ["python", "signatures", "extraction"]

  - id: "BL-071"
    title: "Ollama-served embedding backend for L2, plus capability-aware L4 model resolution"
    summary: "Adds --backend ollama as a third L2 embedding backend and fixes two defects that left the existing L4 Ollama surface silently disabled on hosts without a qwen2.5-coder tag."
    description: |
      L2 gained OllamaEmbeddingBackend (POST /api/embed at $OLLAMA_HOST,
      default nomic-embed-text, recorded in bundles as "ollama:<model>"),
      wired through build_backend() into run_l2/run_l3/run_l4/run_xrefs.
      Server output is treated as untrusted input: rows are re-normalized
      client-side and row-count / dimension mismatches raise rather than
      propagating garbage, so the L2 contract (float32, L2-normalized)
      holds regardless of server behavior. Three typed errors, including
      one surfacing the server's own message for the observed Ollama
      0.32.1 HTTP 501 "This server does not support embeddings" returned
      for a generation-only tag.

      Query-side parity: the FastAPI search endpoint, the MCP
      semantic_neighbors tool, and the cbm_walkthrough question panel all
      re-embed queries through the bundle's own model and degrade to
      lexical when the server is unavailable, disclosing which path
      answered via the response "mode" field. The query-embed timeout
      (6 s) sits under the MCP 10 s dispatch budget so a slow server
      degrades instead of timing out the whole call.

      Two root-cause L4 fixes, both observed live on a host with no
      qwen2.5-coder tag installed. (1) The fallback chain was
      coder-family-only, so a host with a capable general model emitted
      zero enrichments; resolve_model now falls back to models the server
      *reports* as completion-capable via /api/tags — evidence, not
      name-matching, so an embedding-only tag is never selected and a
      server too old to report capabilities yields no substitution rather
      than a guess. (2) run_l4.py --llm-model defaulted to the
      DEFAULT_MODEL literal, passing a non-None "explicit" model on every
      run and silently killing $CBM_LLM_MODEL, which .env.example
      advertised as working.
    category: "feature"
    type: "feature"
    status: "done"
    complexity: "M"
    priority: "medium"
    rationale: "Semantic bundles previously required the sentence-transformers/torch stack in-process; Ollama is already a hard dependency of the L4 layer, so reusing it for embeddings adds a real-vector option at no new dependency cost. The L4 resolution defects made the shipped Ollama surface emit zero enrichments on an otherwise healthy host."
    acceptance_criteria:
      - "--backend ollama is accepted by run_l2, run_l3, run_l4, and run_xrefs, and the bundle's embeddings_meta.json records backend.name as 'ollama:<model>'."
      - "Server responses are validated: row-count and dimension mismatches raise, and every emitted row is L2-normalized client-side."
      - "tests/verify_l2.py --backend ollama passes the full L2 contract suite against a live server, including byte-identical determinism across two runs."
      - "FastAPI search, MCP semantic_neighbors, and the walkthrough panel embed queries through the bundle's model and fall back to lexical when the server is unavailable."
      - "resolve_model selects a completion-capable model reported by the server when the curated family chain misses, and never selects an embedding-only tag."
      - "run_l4.py --llm-model defaults to None so $CBM_LLM_MODEL is honored."
    evidence_checks:
      - kind: "grep"
        path: "plugins/chunks_embeddings/backends.py"
        pattern: "class OllamaEmbeddingBackend"
      - kind: "grep"
        path: "plugins/llm_enrich/model_resolver.py"
        pattern: "def completion_capable_models"
      - kind: "file-exists"
        path: "tests/test_ollama_embedding_backend.py"
      - kind: "grep"
        path: "frontend/backend/serving/application/chunks.py"
        pattern: "_embed_query_ollama"
    references:
      - "plugins/chunks_embeddings/backends.py"
      - "plugins/chunks_embeddings/__init__.py"
      - "plugins/llm_enrich/model_resolver.py"
      - "plugins/llm_enrich/client.py"
      - "frontend/backend/serving/application/chunks.py"
      - "scripts/cbm_walkthrough.py"
      - "tests/test_ollama_embedding_backend.py"
      - "tests/test_llm_enrich_model_resolver.py"
      - "docs/analyze.md"
    owner: "mine"
    source: "Session request 'build all the ollama backend', 2026-07-26/27. Verified live against Ollama 0.32.1: run_l2 --backend ollama emits a SHACL-conforming bundle; tests/verify_l2.py --backend ollama passes 18/18; the four online L4 verifiers (79 checks) pass on a host with no qwen2.5-coder tag, where they previously could not run. Commit fdfe943."
    tags: ["l2", "l4", "embeddings", "ollama", "degradation"]
