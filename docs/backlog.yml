  - id: "BL-002"
    title: "Member containment edges and qualified chunk identity"
    summary: "Add class-to-member containment edges and queryable qualified chunk symbols so class boxes assemble by graph query, not string joins."
    description: |
      Refined 2026-07-11 (verification pass): chunk IRIs already encode file
      path, parent symbol, and byte span (chunk_id built at
      plugins/chunks_embeddings/embedder.py:121-129), so same-named classes
      in different files never collided as IRIs. The real gaps were (1) no
      containment predicate — cbml2:parentSymbol was a bare string literal,
      with no memberOf/hasMember edge anywhere in the L2 vocabulary, so one
      UML class box required a string join on (inFile, parentSymbol); and
      (2) no queryable qualified name — the qualification lived only inside
      the opaque URL-quoted chunk IRI. The dossier shows the downstream
      failure mode: it keys its class tree by bare class name and silently
      overwrites duplicates (scripts/cbm_dossier.py:1659).

      Shipped: cbml2:memberOf (member chunk -> class chunk, resolved
      mechanically by same-file symbol match with tightest-enclosing-byte-span
      disambiguation and a unique-candidate fallback for out-of-line
      definitions; ambiguity emits nothing) and cbml2:qualifiedSymbol
      (Parent.symbol for members, symbol otherwise; file-kind chunks carry
      none). Shapes extended, SHACL golden regenerated via
      make regen-shacl-golden. Note: no L2 schema-version constant exists to
      bump (verified repo-wide); the drift guards are the effective gate.
    category: "feature"
    type: "feature"
    status: "done"
    complexity: "S"
    priority: "high"
    rationale: "Without containment edges and a queryable qualified name, class boxes require fragile string joins on parentSymbol literals."
    acceptance_criteria:
      - "A single SPARQL query returns every method chunk of a given class chunk via one cbml2:memberOf edge, with no string joins on parentSymbol."
      - "Two same-named classes in different files of a fixture resolve to distinct IRIs with distinct member sets (tests/test_chunk_containment.py)."
      - "SHACL golden regenerated; shape/spec drift guards and the L2 end-to-end verifier stay green."
    evidence_checks:
