  - id: "BL-003"
    title: "Extract class fields and attributes with declared types"
    summary: "Extract data members (fields, properties, instance variables) with their declared types as first-class chunk facts."
    description: |
      No language analyzer records class data members. Chunk kinds stop at
      function/class/method/file (plugins/chunks_embeddings/chunker.py:20);
      the signature contract has no member-fields entry
      (plugins/chunks_embeddings/signatures.py:42-45). C++ walks
      field_declaration_list only to locate methods and explicitly skips
      plain data members (cpp.py:297, :335-337); Go touches it only to bound
      the struct signature text (go.py:116-120). Closest existing
      approximations are C file-scope variables and Clojure record field
      vectors. Without fields the UML attribute compartment is empty, and
      association, aggregation, composition, and multiplicity edges have no
      basis at all — this is the single largest class-diagram gap. Add a
      field chunk kind (or a members list on class chunks) carrying name,
      declared type as written, and default, per language: Python AnnAssign
      and annotated self-assignments, TS/JS class fields, Java/Kotlin/Swift
      fields, Go and Rust struct fields, C++ member declarations. Honor the
      omission contract; no inferred types.

      Refined 2026-07-11: the closed kind vocabulary lives in the L2 plugin
      only — CHUNK_KINDS at plugins/chunks_embeddings/graph_writer.py:60
      feeds an sh:in shape constraint; emission/domain/inventory_schema.py
      is L1 and does not constrain chunk kinds. That closure is already
      leaky: the Clojure chunker emits a fifth kind "var"
      (chunker.py:1250-1256) outside the sh:in set. A "field" kind must
      widen CHUNK_KINDS, the shape, and reconcile the Clojure leak.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "M"
    priority: "critical"
    rationale: "Largest single UML gap: empty attribute compartments and no basis for association, aggregation, or multiplicity edges."
    acceptance_criteria:
      - "Class chunks in mapped fixtures expose field members with declared types via SPARQL."
      - "Fixtures cover at least Python, TypeScript, Java, Go, and Rust."
      - "ast_coverage.json discloses which languages lack field extraction."
    references:
      - "plugins/chunks_embeddings/chunker.py:20-29"
      - "plugins/chunks_embeddings/signatures.py:42-45"
      - "plugins/chunks_embeddings/graph_writer.py:60"
      - "codebase_mapper/inspection/languages/go.py:116-120"
      - "codebase_mapper/inspection/languages/cpp.py:297"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "extraction", "fields", "associations"]

  - id: "BL-004"
    title: "Resolve type literals into references xref edges"
    summary: "Bind baseType, parameter, and return type literals to their defining class chunks and emit the reserved references xref kind."
    description: |
      Type information reaches the graph only as strings written in source:
      cbml2:baseType, cbml2:returnsType, and the types inside
      cbml2:paramsJson are never resolved to the chunk that defines the
      type, so uses-dependencies between classes cannot be drawn. The
      references kind is already declared in XrefKind
      (codebase_mapper/emission/models.py:8) and allowed by the xref shapes,
      but no resolver emits it — the vocabulary slot for exactly this fact
      exists and is empty. Reuse the per-language import-binding machinery
      the resolvers already have; tag resolution exact/heuristic/ambiguous
      as today. Association edges additionally require field types from
      BL-003.

      Refined 2026-07-11: dropped the BL-002 dependency — a references edge
      is structurally identical to the already-working subclassOf edge (two
      chunk IRIs, which were unique before BL-002); the only real
      prerequisite is BL-003, and only for the association-edge subset.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "Type facts stay literal strings, so uses-dependencies cannot be drawn; the vocabulary already reserves the edge kind."
    acceptance_criteria:
      - "Mapping a fixture emits at least one references edge binding a parameter or return type to an in-repo class chunk."
      - "Unresolved type names are disclosed through the existing unresolved sidecar with reasons."
      - "The xref manifest by_kind counts include references."
    references:
      - "codebase_mapper/emission/models.py:8"
      - "plugins/symbol_xrefs/graph_writer.py:68-78"
      - "plugins/chunks_embeddings/graph_writer.py:105-117"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "xrefs", "type-resolution", "dependencies"]

  - id: "BL-005"
    title: "Preserve extends vs implements through the chunk contract"
    summary: "Carry the generalization/realization distinction from analyzers into the graph instead of collapsing it into bases."
    description: |
      Java, C++, and Objective-C analyzers already extract extends and
      implements as separate item fields — and keep them alongside the
      merged bases list (codebase_mapper/inspection/languages/java.py:383-385,
      cpp.py:390-396, objc.py:474-477) — but the canonical L2 copy-through
      propagates only keys in SIGNATURE_FIELDS, which has bases and not
      extends/implements (plugins/chunks_embeddings/signatures.py:42-45,
      :57-69), and the TS/JS chunker folds both heritage clauses into one
      bases list (plugins/chunks_embeddings/chunker.py:496-523). UML renders
      generalization (solid triangle) and realization (dashed triangle)
      differently; the distinction is parsed today and then destroyed at the
      chunk boundary. Widen the canonical contract, emit distinct
      predicates, and either split the subclassOf xref kind or add an
      implementsOf kind.

      Shipped 2026-07-11: SIGNATURE_FIELDS widened with extends/implements;
      the TS/JS chunker splits heritage clauses (bases stays the merged
      back-compat view); ChunkGraphWriter emits cbml2:extendsType /
      cbml2:implementsType; shapes extended and the SHACL golden
      regenerated. Resolver-kind split (implementsOf) intentionally not
      needed: the acceptance criteria are met by the chunk predicates.
    category: "feature"
    type: "tech-debt"
    status: "done"
    complexity: "S"
    priority: "high"
    rationale: "The distinction is parsed today and destroyed by the copy-through, losing generalization vs realization arrowheads."
    acceptance_criteria:
      - "A Java fixture with class X extends A implements B yields distinguishable graph facts for A versus B."
      - "A TypeScript class with both heritage clauses yields the same distinction."
      - "Existing subclassOf consumers keep working or are migrated in the same change."
    evidence_checks:
