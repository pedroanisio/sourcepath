      - "plugins/symbol_xrefs/graph_writer.py:68-78"
    owner: "mine"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "dossier", "reporting", "graph-consumption"]

  - id: "BL-012"
    title: "Chunk nested and inner declarations beyond one level"
    summary: "Extend chunking past one nesting level so inner classes, nested functions, and module-level constants become nodes."
    description: |
      Refined 2026-07-11 — this is a Python + TypeScript/JavaScript gap,
      not a universal chunker limit. The one-nesting-level strategy note
      (plugins/chunks_embeddings/chunker.py:4-16) describes only the
      re-parse chunkers: _chunk_python (chunker.py:141+) iterates tree.body
      and one method level, so a class inside a class is dropped entirely
      (with all its methods), as are nested functions; _chunk_tsjs has the
      same shape. The items-based languages already chunk deeper — Java
      inner classes get their own chunks with parent set
      (chunker.py:1138-1140), and Kotlin/Swift/Ruby analyzers recurse
      arbitrarily deep. Fix the two re-parse chunkers; qualified chunk
      identity (BL-002, done) already prevents deeper-symbol collisions.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "M"
    priority: "low"
    rationale: "Inner declarations never become nodes, silently truncating class diagrams of nested designs."
    dependencies: ["BL-002"]
    acceptance_criteria:
      - "A fixture with an inner class and a nested function yields chunks for both, with containment edges to their parents."
      - "Embedding and xref layers accept the deeper chunks without regression."
    references:
      - "plugins/chunks_embeddings/chunker.py:4-16"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "l2-chunks", "nesting"]

  - id: "BL-013"
    title: "Widen Python xref binding scope"
    summary: "Bind attribute bases, module-qualified calls, and star imports in the Python resolver to shrink disclosed inheritance holes."
    description: |
      The Python resolver defers attribute bases (pkg.Base), import X
      followed by X.foo(), from X import *, and metaclass bases
      (plugins/symbol_xrefs/python_resolver.py:37-44) — all common in real
      codebases, so multiple-inheritance graphs render with holes that are
      disclosed only in the unresolved sidecar. Module-qualified binding is
      parse-certain via the existing module index (host:python_by_module);
      attribute bases on imported modules likewise. Anything requiring type
      inference stays out of scope here (see BL-010).
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "Common Python idioms leave disclosed holes in inheritance and call graphs."
    acceptance_criteria:
      - "class Sub(pkg.Base) with import pkg resolves to a subclassOf edge when pkg is in-repo."
      - "import X followed by X.foo() resolves to a calls edge when X is in-repo."
      - "Resolution tier stays exact for module-index-backed binds; anything weaker is tagged heuristic."
    references:
      - "plugins/symbol_xrefs/python_resolver.py:37-44"
      - "codebase_mapper/inspection/languages/python.py:225-248"
      - "codebase_mapper/inspection/pipeline.py:395"
      - "plugins/symbol_xrefs/python_resolver.py:105"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "xrefs", "python", "resolution-scope"]

  - id: "BL-014"
    title: "Register the xref layer in the enriched-bundle runners"
    summary: "run_l3.py and run_l4.py never register symbol_xrefs, so enriched bundles ship with no inheritance or call edges at all."
    description: |
      Plugin registration is siloed per runner script: only
      scripts/run_xrefs.py registers the symbol_xrefs plugin
      (run_xrefs.py:104-105; it can also add concepts and LLM enrichment
      via flags). The enriched-bundle runners register chunks, concepts,
      and llm_enrich but never symbol_xrefs (run_l3.py:68-89,
      run_l4.py:135-166). Evidence: the doc-ray bundle
      (_tmp/doc-ray, mapped 2026-07-11T18:25:52Z) has zero cbmxr triples
      in inventory.ttl, no xrefs.jsonl artifact, and no l3_10_xrefs
      fragment in run_manifest.json extensions — while carrying full
      chunk, concept, and L4 layers. Downstream, the dossier refuses
      four UML behavior diagrams with the line "imports are not calls;
      no interactions recorded", which is true of such bundles but false
      of the pipeline's capability. Recommended fix: register
      symbol_xrefs by default in run_l3/run_l4 (opt-out flag), or
      promote run_xrefs.py to the canonical full-stack runner; either
      way one runner produces the complete layer set.

      Shipped 2026-07-11: symbol_xrefs registered by default in run_l3.py
      and run_l4.py with a --no-xrefs opt-out (and a disclosed note when
      --no-l2 disables the layer implicitly). Verified end-to-end: the
      re-mapped doc-ray bundle carries 1337 resolved xref edges (was 0).
      Correction from implementation: the manifest fragment key is
      l3_50_xrefs_artifact, not l3_10_xrefs as the acceptance criterion
      guessed.
    category: "ops"
    type: "infra"
    status: "done"
    complexity: "XS"
    priority: "high"
    rationale: "The pipeline's inheritance/call capability exists but never reaches enriched bundles, so every downstream consumer sees a capability gap that is actually a configuration gap."
    acceptance_criteria:
      - "A bundle produced by the enriched runner contains cbmxr edges, an xrefs.jsonl artifact, and an l3_10_xrefs fragment in run_manifest.json."
      - "Re-mapping doc-ray yields a nonzero cbmxr triple count."
      - "The registration default and its opt-out are documented in the runner help text."
    evidence_checks:
      - kind: "grep"
        path: "scripts/run_l3.py"
        pattern: "symbol_xrefs.register_all"
        expect: true
      - kind: "grep"
        path: "scripts/run_l4.py"
        pattern: "symbol_xrefs.register_all"
        expect: true
      - kind: "file-exists"
        path: "tests/test_runner_xref_registration.py"
    references:
      - "scripts/run_xrefs.py:104-105"
      - "scripts/run_l3.py:68-89"
      - "scripts/run_l4.py:135-166"
      - "_tmp/doc-ray/run_manifest.json"
    owner: "mine"
    source: "doc-ray dossier review (reports/doc-ray__dossier__20260711T214556Z.pdf), Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "xrefs", "runners", "ops"]

  - id: "BL-015"
    title: "Dossier class-hierarchy text promises figures the tree filter can drop"
    summary: "The class-diagram section unconditionally prints that hierarchies follow, while the component filter can silently drop every figure."
    description: |
      The paragraph at scripts/cbm_dossier.py:1881-1886 always states
      "The two largest hierarchies follow", but the tree list is built
      with a size filter — trees = [mk_tree(c) for c in comps[:2] if
      len(c) >= 4] (cbm_dossier.py:1712) — so a repository whose largest
      inheritance component has fewer than four classes gets the promise
      followed by no figure at all. Shipped instance: the doc-ray
      dossier (reports/doc-ray__dossier__20260711T214556Z.pdf, p.26)
      reports 123 classes with 1 internal generalization edge and then
      renders zero hierarchy figures. This violates the chapter's own
      stated house rule ("a diagram without data is fiction") in the
      inverse direction: prose asserting figures that do not exist. Fix:
      condition the paragraph on the tree list; when empty, emit an
      explicit refusal note naming the threshold; when figures render,
      disclose the >=4-class filter in the caption. Independent of and
      not superseded by BL-011 — that rewire replaces the data source,
      this fixes the prose/figure contract and is shippable now.

      Shipped 2026-07-11 (inside the BL-011 rewrite, which replaced the
      defective code path): class_forest_prose() promises figures only when
      trees render and otherwise emits an explicit refusal naming the
      4-class threshold and the largest component. Verified in a real
      render: the re-mapped doc-ray dossier refuses with "largest: 2"
      instead of promising hierarchies that never appear.
    category: "tooling"
    type: "bug"
    status: "done"
    complexity: "XS"
    priority: "medium"
    rationale: "A verification-first report must not assert the presence of figures it did not render."
    acceptance_criteria:
      - "A dossier over a bundle whose largest hierarchy has fewer than four classes renders either figures or an explicit refusal note — never the promise with nothing after it."
      - "The component-size threshold is disclosed wherever hierarchies render."
      - "The paragraph's class/edge counts remain, sourced as today."
    evidence_checks:
      - kind: "grep"
        path: "scripts/cbm_dossier.py"
        pattern: "class_forest_prose"
        expect: true
      - kind: "grep"
        path: "scripts/cbm_dossier.py"
        pattern: "refused rather than"
        expect: true
    references:
      - "scripts/cbm_dossier.py:1712"
      - "scripts/cbm_dossier.py:1881-1886"
      - "reports/doc-ray__dossier__20260711T214556Z.pdf"
    owner: "mine"
    source: "doc-ray dossier review (reports/doc-ray__dossier__20260711T214556Z.pdf), Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "dossier", "reporting", "disclosure"]

  # ===================================================================
  # Error-free mapping cluster (BL-016..BL-023)
  # Source: docs/plan/error-free-mapping.md (2026-07-10) error ledger
  # E1..E9. E5 (git provenance) is closed by operator decision and is
  # deliberately not registered. Every budget below is quoted from the
  # plan's own measured ledger, not re-estimated here.
  # ===================================================================

  - id: "BL-016"
    title: "Eliminate tree-sitter parse errors in C-family files"
    summary: "Half of all C-family source files parse with errors, so their extracted facts are silently partial."
    description: |
      The error ledger measures 30,203 of 61,203 source files (49%)
      carrying 405,660 tree-sitter error nodes, concentrated in the
      C family. A file that parses with errors still yields records,
      so the bundle presents partial extraction as complete
      extraction. Root causes named by the plan include missing
      preprocessor handling and dialect drift. Until the parse-error
      budget is met, every downstream count over C-family repositories
      understates reality without disclosing it.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "L"
    priority: "high"
    rationale: "Partial extraction presented as complete extraction is a silent failure, which the project's own disclosure discipline forbids."
    acceptance_criteria:
      - "Parse-error node count for C-family files meets the budget stated in the plan's ledger."
      - "Any file that still parses with errors carries a machine-readable marker in the bundle."
    references:
      - "docs/plan/error-free-mapping.md:31"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E1, verified live 2026-07-11."
    tags: ["error-free-mapping", "extraction", "c-family"]

  - id: "BL-017"
    title: "Assign a language or an explicit exemption to every file"
    summary: "31% of files carry no language tag, so they are neither analyzed nor explicitly excluded."
    description: |
      The ledger measures 29,012 files (31%) with no language. The
      target budget is at most 3%, with binary and data files exempt
      via an explicit type rather than by silent omission. Today an
      unlanguaged file is indistinguishable from an unsupported one,
      which hides both classifier gaps and genuine binary content
      behind the same empty value.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "An absent language tag conflates 'not supported', 'not detected', and 'not applicable' into one unreadable state."
    acceptance_criteria:
      - "Unlanguaged files fall to at most the budget stated in the ledger."
      - "Every remaining unlanguaged file carries an explicit exemption type."
    references:
      - "docs/plan/error-free-mapping.md:32"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E2, verified live 2026-07-11."
    tags: ["error-free-mapping", "classification"]

  - id: "BL-018"
    title: "Give every zero-symbol file a machine-readable reason"
    summary: "7,380 files extract zero symbols with no recorded reason, so real extractor failures look like empty files."
    description: |
      The ledger counts 7,380 silent zero-symbol files. The stated
      budget is zero by definition: a file that yields no symbols must
      carry an explicit, machine-readable reason (genuinely empty,
      unsupported construct, parse failure, or exempt type). Without
      that reason, an extractor regression is indistinguishable from a
      legitimately empty file, and no verifier can tell them apart.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "A silent zero result is the failure mode the disclosure discipline exists to prevent."
    acceptance_criteria:
      - "Every file with zero extracted symbols carries a reason code in the bundle."
      - "A verifier fails when any zero-symbol file lacks a reason code."
    references:
      - "docs/plan/error-free-mapping.md:33"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E3, verified live 2026-07-11."
    tags: ["error-free-mapping", "extraction", "disclosure"]

  - id: "BL-019"
    title: "Resolve or explicitly tier the 40% of unresolved imports"
    summary: "Two of every five extracted import directives resolve to nothing, with no distinction between ambiguous and wrong."
    description: |
      The ledger measures 155,615 unresolved import directives, about
      40% of those extracted. The plan's target is that hard edges be
      100% precise and every ambiguous directive be preserved under a
      distinct vocabulary tier rather than dropped, which requires a
      cbm:possibleImport predicate and a vocabulary version bump from
      v1 to v2. Today an import that could not be resolved simply
      vanishes, so consumers cannot distinguish 'no such edge' from
      'edge we could not place'.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "L"
    priority: "high"
    rationale: "Dropping unresolved directives destroys evidence; tiering them preserves it and keeps hard edges trustworthy."
    acceptance_criteria:
      - "A cbm:possibleImport tier exists in the vocabulary and carries ambiguous directives."
      - "The vocabulary version is bumped and the SHACL shapes accept the new tier."
      - "Hard cbm:imports edges remain precise."
    references:
      - "docs/plan/error-free-mapping.md:34"
      - "docs/plan/error-free-mapping.md:135"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E4, verified live 2026-07-11."
    tags: ["error-free-mapping", "imports", "vocabulary"]

  - id: "BL-020"
    title: "Close the L4 enrichment scope gaps"
    summary: "Enrichment scope excludes languages and file classes that a complete map should cover, and the data-language boundary is still moving."
    description: |
      The ledger records L4 scope gaps: C++ was excluded from file
      summaries while C was included, and only 59 of 793,210 concepts
      carry descriptions. The C-family exclusion has since been
      corrected in plugins/llm_enrich/enricher.py. The remaining scope
      question is where the boundary for pure-data languages sits:
      schema_purpose is gated by path prefix (static/schemas/) rather
      than by language, so a JSON or YAML file outside that prefix
      receives no L4 enrichment of any kind. Concept description
      coverage remains far below any usable threshold.
    category: "feature"
    type: "tech-debt"
    status: "in-progress"
    complexity: "M"
    priority: "medium"
    rationale: "Enrichment that silently skips whole languages or file classes makes coverage claims unverifiable."
    acceptance_criteria:
      - "Every first-class language is either in an L4 scope or explicitly and testably excluded with a stated reason."
      - "Concept description coverage meets a stated, measured threshold."
    dependencies:
      - "BL-039"
    references:
      - "docs/plan/error-free-mapping.md:36"
      - "plugins/llm_enrich/enricher.py:81"
      - "plugins/llm_enrich/aggregator.py:110"
    owner: "concurrent"
    source: "docs/plan/error-free-mapping.md error ledger E6, verified live 2026-07-11."
    tags: ["error-free-mapping", "llm-enrich", "scope"]

  - id: "BL-021"
    title: "Give every concept an embedding or a provenance-tagged fallback"
    summary: "7,394 concepts carry no embedding, so semantic neighbor queries silently miss them."
    description: |
      The ledger counts 7,394 concepts without an embedding against a
      budget of zero, to be met with a label-embedding fallback that is
      provenance-tagged so consumers can tell a fallback vector from a
      real one. A concept with no vector is invisible to semantic
      search while still appearing in the graph, which is a silent
      recall failure rather than a disclosed one.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "A concept present in the graph but absent from the vector space is a silent recall hole in every semantic query."
    acceptance_criteria:
      - "Every concept has an embedding or a provenance-tagged fallback."
      - "Fallback vectors are distinguishable from computed vectors in the bundle."
    references:
      - "docs/plan/error-free-mapping.md:37"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E7, verified live 2026-07-11."
    tags: ["error-free-mapping", "embeddings", "concepts"]

  - id: "BL-022"
    title: "Make emission streaming and validation affordable at kernel scale"
    summary: "JSON-LD is materialized whole-document in RAM and pySHACL validation takes roughly two hours."
    description: |
      The ledger records two emission-cost errors: the JSON-LD writer
      builds the whole document in memory, and pySHACL validation of a
      large bundle runs for about two hours. The plan's target is a
      streaming JSON-LD writer and a fast structural gate that can run
      on every build, with full SHACL reserved for a slower path. This
      subsumes the linux flaw map's F9, which remains open by choice and
      is today mitigated only by an opt-out environment flag.
    category: "ops"
    type: "tech-debt"
    status: "ready"
    complexity: "L"
    priority: "medium"
    rationale: "An emission path that cannot run at scale forces users to disable validation, which removes the guarantee entirely."
    acceptance_criteria:
      - "JSON-LD emission streams rather than materializing the whole document."
      - "A fast structural gate runs on every build; full SHACL runs on a disclosed slower path."
    references:
      - "docs/plan/error-free-mapping.md:38"
      - "docs/reports/linux-flaw-map.md:40"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E8 and docs/reports/linux-flaw-map.md F9, verified live 2026-07-11."
    tags: ["error-free-mapping", "emission", "scale", "shacl"]

  - id: "BL-023"
    title: "Wire the verify-bundle gate and the golden corpus"
    summary: "The bundle gate exists as a module but is not a CLI command, and the golden corpus target does not exist."
    description: |
      E9 names the meta-error: the flaws in the ledger were found by
      hand-audit rather than by the system. The remedy is a
      cbm verify-bundle gate that fails a run when a budget is missed,
      plus a golden corpus that grows forever. Verified state today:
      codebase_mapper/verification/bundle_gate.py exists and its
      docstring already claims the command, but no cbm.py subcommand
      exposes it and the Makefile has no test-corpus target, so the gate
      cannot run and the definition of error-free mapping is not
      enforceable.
    category: "testing"
    type: "infra"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "A plan whose definition of done is a gate that cannot be invoked has no definition of done."
    acceptance_criteria:
      - "cbm verify-bundle is an invocable command that fails on a missed budget."
      - "A golden corpus target exists and runs in the test suite."
    references:
      - "docs/plan/error-free-mapping.md:195"
      - "docs/plan/error-free-mapping.md:221"
      - "codebase_mapper/verification/bundle_gate.py:1"
    owner: "unassigned"
    source: "docs/plan/error-free-mapping.md error ledger E9, verified live 2026-07-11 (module present, command absent)."
    tags: ["error-free-mapping", "verification", "gate"]

  # ===================================================================
  # Enforcement cluster (BL-024..BL-030)
  # Source: REQUIREMENTS.md §12 gap audit (untracked working-tree doc),
  # every claim re-verified mechanically against the tree 2026-07-11
  # before registration. Theme: guarantees that are declared but not
  # enforced, so CI reports green while checking nothing.
  # ===================================================================

  - id: "BL-024"
    title: "Backend live-bundle validation silently skips in CI"
    summary: "CI builds a fixture bundle to a path the tests never read, so all backend endpoint tests skip and the job still reports green."
    description: |
      The drift job writes its fixture bundle to _tmp/ci-bundle, but no
      step sets CBM_OUTPUT_DIR to that path, and the test suite's
      default is _tmp/usl-ng-core-map. The paths do not match, so every
      endpoint integration test skips rather than fails, and CI reports
      success. This is a false green: the REST surface is effectively
      untested in CI while appearing tested.
    category: "testing"
    type: "bug"
    status: "done"
    complexity: "XS"
    priority: "critical"
    rationale: "A test that skips silently and reports green is worse than no test, because it manufactures unearned confidence."
    acceptance_criteria:
      - "CI sets CBM_OUTPUT_DIR to the fixture bundle path it builds."
      - "The endpoint tests execute in CI, and a deliberate break fails the job."
    references:
      - ".github/workflows/lint.yml"
      - "frontend/backend/tests/conftest.py"
    evidence_checks:
      - kind: "grep"
        path: ".github/workflows/lint.yml"
        pattern: "CBM_OUTPUT_DIR"
      - kind: "grep"
        path: ".github/workflows/lint.yml"
        pattern: "CBM_REQUIRE_LIVE_BUNDLE"
      - kind: "grep"
        path: "frontend/backend/tests/conftest.py"
        pattern: "CBM_REQUIRE_LIVE_BUNDLE"
      - kind: "file-exists"
        path: "tests/verify_ci_live_bundle.py"
      - kind: "grep"
        path: "Makefile"
        pattern: "verify_ci_live_bundle"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-004, re-verified 2026-07-11: no CBM_OUTPUT_DIR in .github/workflows/lint.yml."
    tags: ["ci", "false-green", "backend"]

  - id: "BL-025"
    title: "Declared coverage gates are never enforced"
    summary: "Three coverage thresholds are declared across backend, core, and UI; none of them gate anything."
    description: |
      The backend declares a 90% coverage gate in pytest.ini, but every
      real call site passes --no-cov, so the gate never runs. The core
      library has no coverage threshold at all, leaving the 80/60
      figures in the project guidelines aspirational. The React UI
      declares a 90%-on-four-metrics gate in vite.config.ts that is not
      currently met and has no job to run it. A declared gate that never
      executes is a claim without a check.
    category: "testing"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "An unenforced threshold is a statement of intent that reads as a guarantee."
    acceptance_criteria:
      - "At least one automated invocation enforces the backend threshold without --no-cov."
      - "The core library has either a measured threshold or an explicitly documented substitute policy."
      - "The UI threshold is enforced by a job, or lowered to the level actually met."
    references:
      - "frontend/backend/pytest.ini"
      - "frontend/ui/vite.config.ts"
      - "pyproject.toml"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-005 / GAP-009 / GAP-011, re-verified 2026-07-11."
    tags: ["ci", "coverage", "enforcement"]

  - id: "BL-026"
    title: "CI runs a thin verifier slice and no Rust or Node toolchain"
    summary: "Most verifier groups, the unit tree, the Rust crate, and the cartogram tool have no CI job at all."
    description: |
      CI runs lint, mypy, a drift slice, and the backend suite. The
      language verifiers, Rust verifiers, vocabulary verifiers, the bulk
      of the core verifiers, the offline enrichment verifiers, and the
      unit tree never execute in CI. Neither the Rust report crate nor
      the Node cartogram tool has any CI job, so both are unbuilt and
      untested on every push despite having Makefile targets with
      disclosed-skip fallbacks.
    category: "testing"
    type: "infra"
    status: "ready"
    complexity: "M"
    priority: "high"
    rationale: "The verifier suite is this project's primary quality mechanism; leaving most of it out of CI means regressions land unobserved."
    acceptance_criteria:
      - "A CI job runs the full offline test surface, or each currently-unwired group gains a job."
      - "Rust and Node toolchains have build and test jobs."
    references:
      - ".github/workflows/lint.yml"
      - "Makefile:153"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-010 / GAP-012, re-verified 2026-07-11."
    tags: ["ci", "verifiers", "toolchain"]

  - id: "BL-027"
    title: "Lock file freshness is never checked"
    summary: "uv.lock is committed but CI and Docker install with pip, ignoring the lock entirely."
    description: |
      The repository commits uv.lock, yet the CI and container paths
      install with pip in editable mode, which does not consult the
      lock. Nothing verifies that the lock still resolves against
      pyproject.toml, so the lock can drift from the manifest without
      any signal, and a reproducible install is not actually guaranteed
      by the artifacts the repository ships.
    category: "ops"
    type: "infra"
    status: "ready"
    complexity: "XS"
    priority: "medium"
    rationale: "A lock file that nothing validates and nothing installs from provides reproducibility in appearance only."
    acceptance_criteria:
      - "A check fails when uv.lock is stale relative to pyproject.toml."
    references:
      - "drift-risk-map.md:101"
      - ".github/workflows/lint.yml"
    owner: "unassigned"
    source: "drift-risk-map.md M17, re-verified 2026-07-11: no lock-freshness check in CI."
    tags: ["ci", "supply-chain", "drift"]

  - id: "BL-028"
    title: "The UI test suite runs in no aggregate target and no wiring guard sees it"
    summary: "make test omits test-ui, lint omits lint-cartogram, and the wiring verifier only knows about Python test trees."
    description: |
      The umbrella test target enumerates eleven groups but not test-ui,
      even though that target exists, so the five vitest suites never run
      in the full local surface. The lint target is only the import
      boundary check, so lint-cartogram never runs either. The wiring
      verifier that exists to catch exactly this class of omission scans
      only Python test trees, so it stays green while non-Python suites
      go unexecuted. The guard needs to cover every test tree, not only
      the ones it was first written for.
    category: "testing"
    type: "bug"
    status: "ready"
    complexity: "S"
    priority: "high"
    rationale: "A wiring guard that cannot see a whole class of test tree gives false assurance precisely where coverage is thinnest."
    acceptance_criteria:
      - "The umbrella test target runs the UI suite; the lint target runs the cartogram lint."
      - "The wiring verifier fails when any test tree, in any language, is absent from a Makefile group."
    references:
      - "Makefile:153"
      - "Makefile:224"
      - "tests/verify_make_wiring.py:41"
    owner: "unassigned"
    source: "Code sweep 2026-07-11, verified: 'test:' at Makefile:153 lacks test-ui; COVERED_TREES is Python-only."
    tags: ["testing", "wiring", "drift-guard"]

  - id: "BL-029"
    title: "The backend container image cannot start"
    summary: "The backend Dockerfile never copies the serving package, so the image raises an unhandled import error at boot."
    description: |
      The backend Dockerfile copies the application entrypoint but never
      the serving package it imports, and the root package-discovery
      configuration does not include it either. The resulting image
      fails at import time with an unhandled module-not-found error. No
      CI job builds this image, so the break is invisible. This directly
      contradicts the project guideline that every commit must be
      deployable.
    category: "ops"
    type: "bug"
    status: "done"
    complexity: "S"
    priority: "critical"
    rationale: "A container image that cannot start is a broken deliverable, and no automation currently observes it."
    acceptance_criteria:
      - "The built backend image starts and serves a health check."
      - "A CI job builds and smoke-tests the image."
    references:
      - "frontend/backend/Dockerfile"
    evidence_checks:
      - kind: "grep"
        path: "frontend/backend/Dockerfile"
        pattern: "COPY frontend/backend/serving"
      - kind: "file-exists"
        path: "tests/verify_backend_image.py"
      - kind: "grep"
        path: "Makefile"
        pattern: "verify_backend_image"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-001, re-verified 2026-07-11: no COPY of the serving package."
    tags: ["docker", "deployability"]

  - id: "BL-030"
    title: "The root image omits packages and silently degrades language support"
    summary: "The root image leaves out two declared packages and its unpinned dependency list diverges from the manifest."
    description: |
      The root image does not copy the decomposer and recomposer
      packages although the manifest declares them installable, so the
      built CLI cannot run either tool. Its dependency list is also
      unpinned and diverges from the manifest, omitting several
      tree-sitter grammars, the graph store, the validation model
      library, and the settings parser. Because the package installs
      without dependency resolution, those omissions degrade language
      support and the fast emit path silently inside the image rather
      than failing loudly.
    category: "ops"
    type: "bug"
    status: "ready"
    complexity: "S"
    priority: "high"
    rationale: "Silent capability loss inside a shipped image is the least observable failure mode this project can produce."
    acceptance_criteria:
      - "The image contains every package the manifest declares installable."
      - "The image dependency list is generated from, or verified against, the manifest."
    references:
      - "Dockerfile"
      - "pyproject.toml"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-002 / GAP-003, re-verified 2026-07-11."
    tags: ["docker", "dependencies", "degradation"]

  # ===================================================================
  # Serving-surface cluster (BL-031..BL-035)
  # ===================================================================

  - id: "BL-031"
    title: "A malformed sidecar produces a bare unlogged 500"
    summary: "Bundle loading parses sidecar files with no error handling, so one broken file returns an opaque server error."
    description: |
      Bundle loading parses several sidecar files with no guard around
      the deserialization calls and no registered exception handler. A
      syntactically broken sidecar therefore surfaces as a bare,
      unlogged server error with no indication of which file failed or
      why. The application-layer guidance for this project calls for
      graceful handling; a 500 with no log line is the opposite.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "S"
    priority: "medium"
    rationale: "An operator cannot diagnose a corrupt bundle from an unlogged opaque error."
    acceptance_criteria:
      - "A malformed sidecar yields a descriptive error naming the file, and a log entry."
    references:
      - "frontend/backend/serving/application/bundle_data.py"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-008, re-verified 2026-07-11."
    tags: ["backend", "error-handling"]

  - id: "BL-032"
    title: "Response schemas are incomplete and partly undeclared"
    summary: "One response field survives only via permissive extras, and two handlers declare no response model at all."
    description: |
      The file-detail handler returns an external-imports field that its
      response model never declares; it reaches the client only because
      the model permits extra keys, which means the field is invisible
      to the API field-parity drift guard and can be removed by accident
      without any test failing. Two further handlers declare no response
      model at all, so their shapes are absent from the generated
      schema. The parity guard cannot protect what is not declared.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "XS"
    priority: "medium"
    rationale: "A field that exists only by permissiveness is outside every contract the project claims to enforce."
    acceptance_criteria:
      - "The external-imports field is declared on its response model and covered by the parity guard."
      - "Every handler declares a response model, or its omission is justified in the guard's allowlist."
    references:
      - "frontend/backend/serving/application/files.py"
      - "frontend/backend/app.py"
      - "tests/verify_api_field_parity.py"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-006 / GAP-022, re-verified 2026-07-11."
    tags: ["backend", "api", "drift-guard"]

  - id: "BL-033"
    title: "Enrichment sidecars are loaded into memory but no endpoint reads them"
    summary: "The backend loads L4 enrichment data on every bundle load and never serves any of it."
    description: |
      Bundle loading reads the enrichment sidecars into memory on every
      load, but no REST endpoint reads any of that data. It is either
      staged-but-unwired or dead weight; today it is pure cost. The
      equivalent data is already surfaced through the MCP path, so the
      REST surface is the gap. Resolve by wiring it into a response or
      removing the unused load.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "S"
    priority: "medium"
    rationale: "Paying the load cost of data no caller can reach is either an unfinished feature or dead code, and the two must not be indistinguishable."
    acceptance_criteria:
      - "The enrichment data is served by an endpoint, or the load is removed."
    references:
      - "frontend/backend/serving/application/bundle_data.py"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-020, re-verified 2026-07-11."
    tags: ["backend", "llm-enrich", "dead-code"]

  - id: "BL-034"
    title: "Semantic chunk search hardcodes the embedding model name"
    summary: "The query embedder ignores the bundle's recorded model, so a bundle built with another model ranks against the wrong vector space."
    description: |
      The semantic branch of chunk search hardcodes the sentence-encoder
      model name rather than reading it from the bundle's embeddings
      metadata, which does record it. A bundle built with a different
      encoder would be queried with vectors from an unrelated space: no
      error is raised and no warning is emitted, only meaningless
      rankings. This is a silent-correctness failure, the most dangerous
      class of defect this project recognizes.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "XS"
    priority: "high"
    rationale: "Silently ranking against the wrong vector space returns confident nonsense, which is worse than an error."
    acceptance_criteria:
      - "The query embedder reads the model name from the bundle metadata and falls back only when it is absent."
      - "A bundle whose recorded model is unavailable fails loudly rather than ranking."
    references:
      - "frontend/backend/serving/application/chunks.py"
      - "plugins/chunks_embeddings/backends.py"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-023, re-verified 2026-07-11."
    tags: ["backend", "embeddings", "silent-correctness"]

  - id: "BL-035"
    title: "The SPARQL escape hatch leaks its on-disk stores"
    summary: "Each regenerated bundle creates a new temp store directory that is never reclaimed, and the module's own docstring is stale."
    description: |
      The read-only SPARQL surface is disabled by default behind an
      environment flag. When enabled, it opens an on-disk store keyed by
      inventory identity, and the module states plainly that live stores
      are not closed: a regenerated inventory produces a new store
      directory under the temp path while the previous one remains,
      unbounded across rebuilds. Separately, the module docstring claims
      oversized results are truncated silently, while the code does set
      an explicit truncation flag in the response, so the docstring
      understates the behavior and should be corrected.
    category: "ops"
    type: "tech-debt"
    status: "ready"
    complexity: "S"
    priority: "low"
    rationale: "An unbounded temp-directory leak on a long-lived server is an operational failure that only appears under sustained use."
    acceptance_criteria:
      - "Superseded stores are reclaimed, or their growth is bounded and disclosed."
      - "The docstring matches the implemented truncation behavior."
    references:
      - "frontend/mcp_server/sparql.py"
    owner: "unassigned"
    source: "Code sweep 2026-07-11, verified against frontend/mcp_server/sparql.py."
    tags: ["mcp", "sparql", "resource-leak"]

  # ===================================================================
  # Extraction-truth cluster (BL-036..BL-047)
  # The disclosure contract this project holds itself to (degradation is
  # disclosed, never silent) is not upheld in several extraction paths.
  # BL-037 and BL-038 are defects in first-class PHP support introduced
  # by this session and are owned accordingly.
  # ===================================================================

  - id: "BL-036"
    title: "Missing tree-sitter grammars degrade silently instead of disclosing"
    summary: "Analyzers gate availability in their match predicate, so an absent grammar yields neither an AST nor an error code."
    description: |
      Every tree-sitter analyzer tests grammar availability inside its
      match predicate. When the grammar package is absent the analyzer
      does not match, the extraction function never runs, and the
      unavailable-grammar diagnostic inside it is therefore unreachable.
      The file receives no AST and no failure marker: it simply looks
      like a file with nothing in it. The coverage module lists that
      diagnostic among the failure markers it expects to observe, so it
      is waiting for a signal the registry path can never emit. This
      contradicts the project's own commitment that degradation is
      disclosed rather than silent, and it means a deployment with
      missing grammars (which the root image demonstrably produces)
      reports clean extraction over files it never parsed.
    category: "feature"
    type: "bug"
    status: "done"
    complexity: "M"
    priority: "critical"
    rationale: "This is the disclosure contract failing in the exact place it was written to protect, and it compounds the image dependency omission."
    acceptance_criteria:
      - "A file whose grammar is unavailable carries an explicit machine-readable diagnostic in the bundle."
      - "The unavailable-grammar marker is reachable through the registry path and covered by a verifier."
    dependencies:
      - "BL-030"
    references:
      - "codebase_mapper/inspection/_builtins.py:106"
      - "codebase_mapper/inspection/languages/rust.py:150"
      - "codebase_mapper/inspection/coverage.py:48"
    evidence_checks:
      - kind: "grep"
        path: "codebase_mapper/inspection/_builtins.py"
        pattern: "return record\\.language[^\\n]*and (CFML_)?TS_AVAILABLE"
        expect: false
      - kind: "file-exists"
        path: "tests/verify_grammar_disclosure.py"
      - kind: "grep"
        path: "Makefile"
        pattern: "verify_grammar_disclosure"
    owner: "unassigned"
    source: "Code sweep 2026-07-11, verified: match predicates gate on grammar availability, making the diagnostic unreachable."
    tags: ["extraction", "disclosure", "pals-law", "silent-failure"]

  - id: "BL-037"
    title: "PHP extracts no inheritance"
    summary: "The PHP analyzer captures class names but never extends or implements, so PHP can produce no inheritance edges."
    description: |
      The PHP class-like pattern stops at the declared name and captures
      no parent clause, and the analyzer emits no bases key at all. PHP
      is the only class-bearing first-class language in this state: ten
      other analyzers emit bases. The consequence is that no PHP
      repository can yield an inheritance edge, and every downstream
      view that reconstructs class hierarchies is empty for PHP without
      saying why. The existing xref registry item covers a different set
      of languages, all of which already emit bases, so this gap is not
      covered there. Introduced by this session's PHP promotion.
    category: "feature"
    type: "bug"
    status: "done"
    complexity: "S"
    priority: "high"
    rationale: "A language promoted to first class while silently emitting no inheritance makes the first-class claim partly false."
    acceptance_criteria:
      - "The PHP analyzer captures extends and implements clauses and emits bases."
      - "The PHP verifier asserts inheritance extraction over a fixture with both clauses."
    references:
      - "codebase_mapper/inspection/languages/php.py:163"
      - "tests/verify_php.py"
    evidence_checks:
      - kind: "grep"
        path: "codebase_mapper/inspection/languages/php.py"
        pattern: "_parse_bases"
      - kind: "file-exists"
        path: "tests/fixtures/php/app/src/Models/Admin.php"
      - kind: "grep"
        path: "tests/verify_php.py"
        pattern: "test_bases_extraction"
    owner: "mine"
    source: "Code sweep 2026-07-11, verified: zero occurrences of a bases key in the PHP analyzer, against ten peers that emit it."
    tags: ["php", "extraction", "inheritance", "first-class"]

  - id: "BL-038"
    title: "A malformed composer manifest silently voids PHP import resolution"
    summary: "The PSR-4 index swallows every parse failure, so PHP imports go unresolved with no disclosure."
    description: |
      The PHP autoload index catches every exception while reading a
      composer manifest and continues, registering no degradation entry.
      A malformed or unreadable manifest therefore produces an empty
      prefix map, every namespace import silently fails to resolve, and
      the bundle reports a PHP repository with no internal import edges
      as though that were the truth. The enrichment layer sets the
      pattern this should follow: it records a machine-readable
      degradation entry when it self-disables. Introduced by this
      session's PHP promotion.
    category: "feature"
    type: "bug"
    status: "done"
    complexity: "XS"
    priority: "medium"
    rationale: "Swallowing the failure converts a diagnosable input error into an invisible, wrong result."
    acceptance_criteria:
      - "A composer manifest that cannot be parsed registers a degradation entry naming the file."
      - "A verifier asserts the degradation is recorded rather than swallowed."
    references:
      - "codebase_mapper/inspection/_builtins.py:726"
      - "plugins/llm_enrich/enricher.py:186"
    evidence_checks:
      - kind: "grep"
        path: "codebase_mapper/inspection/languages/php.py"
        pattern: "ComposerManifestError"
      - kind: "grep"
        path: "codebase_mapper/inspection/_builtins.py"
        pattern: "composer_manifest_unreadable"
      - kind: "grep"
        path: "tests/verify_php.py"
        pattern: "test_composer_degradation"
    owner: "mine"
    source: "Code sweep 2026-07-11, verified: broad exception swallow with no degradation entry."
    tags: ["php", "imports", "disclosure", "pals-law"]

  - id: "BL-039"
    title: "The first-class L4 facet contradicts the data-language enrichment boundary"
    summary: "Two live contracts disagree about whether JSON and YAML must be in the file-summary scope, and the language verifiers are red because of it."
    description: |
      The first-class language contract requires each first-class
      language to appear in the L4 summary scope, and the JSON and YAML
      verifiers assert exactly that. A concurrent change removed the
      pure-data languages from that scope on the grounds that they get a
      schema-purpose scope instead, and pinned that with its own test.
      Both contracts are now live and mutually exclusive: the JSON and
      YAML verifiers each fail their L4 facet. The schema-purpose scope
      is real, but it is gated by path prefix rather than by language,
      so a data file outside that prefix receives no enrichment at all
      and the substitution does not actually hold in general. Resolution
      requires deciding what the L4 facet means for a pure-data language
      and making one contract authoritative, rather than leaving two
      tests to contradict each other.
    category: "testing"
    type: "bug"
    status: "ready"
    complexity: "S"
    priority: "high"
    rationale: "Two committed contracts asserting opposite things means the suite cannot be green and neither claim is trustworthy."
    acceptance_criteria:
      - "One contract is authoritative and the other is amended to match, with the reasoning recorded."
      - "The JSON and YAML verifiers pass without weakening the first-class definition for code languages."
    references:
      - "plugins/llm_enrich/enricher.py:81"
      - "plugins/llm_enrich/aggregator.py:110"
      - "tests/verify_json.py"
      - "tests/verify_yaml.py"
      - "tests/test_l4_scope_extension.py"
    owner: "shared"
    source: "Verified 2026-07-11: verify_json and verify_yaml each fail the L4 facet in the current working tree."
    tags: ["contract", "llm-enrich", "first-class", "red-test"]

  - id: "BL-040"
    title: "Macro-generated symbols are structurally uncapturable"
    summary: "The analyzers run no C preprocessor, so macro-defined functions parse cleanly and contribute no symbol."
    description: |
      The coverage module states the limitation plainly: the analyzers do
      not run a preprocessor, so macro-generated definitions are not
      function or declaration nodes. They raise no parse error and
      contribute no symbol, which is why the clean-parse zero-symbol
      column exists. The gap is therefore measured and disclosed but
      never registered as work, and it is a large share of the
      zero-symbol population in kernel-scale C repositories.
    category: "feature"
    type: "research"
    status: "parked"
    complexity: "XL"
    priority: "low"
    rationale: "The limitation is disclosed and bounded; closing it means preprocessing, which is a scope decision the operator should make deliberately."
    acceptance_criteria:
      - "A decision is recorded: either a preprocessing path is built, or the limitation is accepted as a permanent, disclosed boundary."
    references:
      - "codebase_mapper/inspection/coverage.py:8"
    owner: "unassigned"
    source: "Code sweep 2026-07-11, verified against the coverage module's own documented limitation."
    tags: ["extraction", "c-family", "preprocessor", "boundary"]

  - id: "BL-041"
    title: "Retire the test-edge stem heuristic in favor of typed-import derivation"
    summary: "The product's own reports recommend retiring the stem heuristic, but it still runs first and the typed derivation is only a fallback."
    description: |
      Test edges are derived first by matching file stems, with a
      typed-import derivation available only as a later fallback
      strategy. The generated reports already carry the finding that a
      large share of the heuristic edges point at a single target, and
      the report text itself carries a recommendation to derive test
      evidence from typed imports minus test-infrastructure targets and
      retire the stem heuristic. The recommendation is shipped to users
      but exists nowhere as work. Inverting the strategy order is the
      substance of the change.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "Shipping a recommendation to users while never scheduling it leaves the product arguing against its own output."
    acceptance_criteria:
      - "Typed-import derivation is the primary strategy for test edges."
      - "Precision of the resulting edges is measured against the prior heuristic and recorded."
    references:
      - "codebase_mapper/inspection/tests_edges.py:105"
      - "scripts/cbm_report.py:1177"
    owner: "unassigned"
    source: "Code sweep 2026-07-11, verified: stem match is strategy 1; typed-import derivation is the fallback."
    tags: ["tests-edges", "precision", "heuristic"]

  - id: "BL-042"
    title: "The import extractor misses proto imports and dynamic Python imports"
    summary: "Two whole classes of import directive are invisible, so modules reachable only that way show zero inbound edges."
    description: |
      The import-edge extractor does not see protocol-buffer import
      statements, nor dynamic Python imports performed through the import
      library. At least one production module in this repository is
      reachable only via dynamic discovery and consequently shows no
      inbound import edges, which makes it look unreferenced when it is
      not. This is file-level import extraction, distinct from the
      symbol-level binding scope covered elsewhere in this backlog.
    category: "feature"
    type: "bug"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "A module that is used but shows no inbound edges will be read as dead code by every consumer of the graph."
    acceptance_criteria:
      - "Protocol-buffer import statements produce import edges."
      - "Dynamically imported modules are either resolved or explicitly marked as dynamically reachable."
    references:
      - "docs/ONBOARDING.md:134"
      - "frontend/mcp_server/sparql.py"
    owner: "unassigned"
    source: "docs/ONBOARDING.md stated limitation, re-verified 2026-07-11."
    tags: ["imports", "extraction", "proto", "python"]

  - id: "BL-043"
    title: "Concept canonicalization is prototype-grade"
    summary: "Canonicalization is a naive suffix strip with no lemmatizer, which the plugin itself documents."
    description: |
      Concept canonicalization lowercases and strips plural and common
      verb suffixes by pattern. The plugin's own comments state that a
      real lemmatizer belongs here and that the current approach is a
      stand-in. The consequence is over- and under-merging of concepts,
      which propagates into every concept-level view and into the
      embedding neighborhoods built on top of them.
    category: "feature"
    type: "tech-debt"
    status: "ready"
    complexity: "M"
    priority: "low"
    rationale: "Concept identity is the substrate for every semantic view; a naive merge rule silently distorts all of them."
    acceptance_criteria:
      - "Canonicalization uses a real lemmatizer, or the naive rule is measured and accepted with recorded error rates."
    references:
      - "plugins/concept_graph/concepts.py:39"
    owner: "unassigned"
    source: "plugins/concept_graph/concepts.py self-documented limitation, re-verified 2026-07-11."
    tags: ["concepts", "canonicalization", "nlp"]

  - id: "BL-044"
    title: "Regeneration supports four languages of fifteen"
    summary: "The AST-only regeneration path covers Python, Rust, TypeScript, and JavaScript; every other first-class language reports unsupported."
    description: |
      Blob-free regeneration is registered for four languages. Every
      other first-class language, including the recently promoted ones,
      has no regenerator and always reports an unsupported-AST result.
      The blob-based reconstruction path still works for all languages,
      so this is a narrower fidelity ceiling rather than a silent
      failure, and it is partly documented. It is nonetheless a growing
      gap: each language promotion widens it by one.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "L"
    priority: "medium"
    rationale: "Every language promotion widens this gap, so leaving it unregistered guarantees it grows unobserved."
    acceptance_criteria:
      - "A decision is recorded on which languages get regenerators, and the unsupported result names the reason."
    references:
      - "codebase_mapper/emission/application/regenerate.py:29"
      - "docs/regenerate.md"
    owner: "unassigned"
    source: "REQUIREMENTS.md GAP-018, re-verified 2026-07-11: registry holds python, rust, typescript, javascript."
    tags: ["regenerate", "languages", "fidelity"]

  - id: "BL-045"
    title: "Byte-identical Python regeneration needs a concrete-syntax extractor"
    summary: "The abstract-syntax extractor discards comments, blank lines, quote style, and trailing commas."
    description: |
      Python regeneration is semantic-perfect but not byte-identical:
      comments, blank lines, string-quote style, and trailing commas are
      lost because the extractor is built on the abstract syntax tree.
      The documentation already states that byte-identical output would
      require swapping in a concrete-syntax library. This is a
      conditional capability, not a defect, and should be registered as
      such rather than living only in a README aside.
    category: "feature"
    type: "research"
    status: "parked"
    complexity: "L"
    priority: "low"
    rationale: "The trade-off is understood and documented; it needs an owner and a trigger, not a rewrite today."
    acceptance_criteria:
      - "A decision is recorded on whether byte-identical Python output is a requirement."
    references:
      - "README.md:308"
    owner: "unassigned"
    source: "README.md stated conditional capability, re-verified 2026-07-11."
