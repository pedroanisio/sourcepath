  - id: "BL-009"
    title: "Record call-site position and order on calls edges"
    summary: "Extend calls xref edges with call-site line and per-caller ordering so interaction sketches can be sequenced."
    description: |
      SymbolXrefEdge is deduped on (src, dst, kind, resolver)
      (codebase_mapper/emission/models.py:20-27; the edge IRI hashes exactly
      those four fields, plugins/symbol_xrefs/graph_writer.py:59-62) and
      carries no call-site line, no ordering, and no multiplicity — sequence
      diagrams are ordered message sends, so no interaction diagram can be
      derived from the current shape. Reify per-call-site facts (line,
      ordinal within the caller body, occurrence count) on the edge node;
      identity must extend to the call site or the new facts become
      multi-valued on one node.

      Refined 2026-07-11 — scope asymmetry discovered: for Python, source
      positions are stripped from the stored AST by design (python.py:25-37
      captures only _fields, not lineno/col_offset), so the resolver cannot
      read a line off the reconstructed ast.Call node; carrying lines
      requires extending the ast_json encoding, re-parsing in the resolver,
      or capturing call sites at analysis time. Ordinal and occurrence
      count, by contrast, are recoverable now from AST walk order. The
      line-carrying half drives the raised complexity.
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "L"
    priority: "medium"
    rationale: "Deduped pair edges cannot order messages, so no interaction diagram can be derived."
    acceptance_criteria:
      - "A caller with three ordered calls in a fixture yields three orderable call-site facts."
      - "Edge identity remains stable across re-maps of an unchanged repo."
    references:
      - "codebase_mapper/emission/models.py:20-27"
      - "plugins/symbol_xrefs/graph_writer.py:59-62"
    owner: "unassigned"
    source: "UML reconstruction gap analysis, Claude Fable 5 via Claude Code, 2026-07-11."
    tags: ["uml", "sequence-diagrams", "xrefs", "call-graph"]

