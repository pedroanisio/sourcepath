name: Lint

on:
  push:
  pull_request:

jobs:
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce import boundaries
        run: lint-imports

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/backend/requirements.txt
          python -m pip install -r frontend/mcp_server/requirements.txt

      # The executed half of the repo's Python type annotations; scope and
      # per-module policy live in pyproject.toml [tool.mypy].
      - name: Type-check (mypy)
        run: python -m mypy

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/backend/requirements.txt
          # pytest-cov: the backend pytest.ini passes --cov flags unconditionally
          python -m pip install pytest pytest-cov httpx

      # Golden-repo E2E: diffs the emitted bundle against a hand-written
      # expected projection — ground truth for the extractors, not
      # self-referential SHACL consistency.
      - name: Golden-repo extraction contract
        run: python tests/verify_golden_repo.py

      # Scope-A SHACL gate: fixture ABoxes conform; injected atScope /
      # dominant-value / provenance violations are rejected.
      - name: Dimension-shape SHACL contract
        run: python tests/verify_dimension_shapes.py

      # Backend perimeter: fail-closed auth and narrowed CORS.
      - name: Backend perimeter tests
        run: python -m pytest frontend/backend/tests/test_perimeter.py -q --no-cov

  # The drift suite guards every hand-mirrored contract (docs<->code, env
  # inventory, API field parity, report predicates, Rust-crate keys). It is
  # fast and fully offline; running it only via `make test` left every guard
  # dependent on contributor discipline (drift-risk-map H10).
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/backend/requirements.txt
          # pytest-cov: the backend pytest.ini passes --cov flags unconditionally
          python -m pip install pytest pytest-cov

      - name: Drift verifiers
        run: make test-drift

      # Live handler validation (drift-risk H4): emit a real bundle, then
      # drive every MCP handler + backend suite against it — output schemas
      # are validated on live payloads, not hand-written samples.
      - name: Generate live fixture bundle
        run: python scripts/run_l3.py --repo tests/fixtures/golden_repo --out _tmp/ci-bundle --backend hash

      # CBM_OUTPUT_DIR must name the bundle the step above just wrote. Without
      # it the suite looked at its default path, found nothing, skipped every
      # live-bundle test and reported green — the REST surface was untested in
      # CI while appearing tested (BL-024). CBM_REQUIRE_LIVE_BUNDLE then makes
      # a missing bundle a hard error, so this can never silently lapse back
      # into skipping. Held by tests/verify_ci_live_bundle.py.
      - name: Backend + MCP suites against the live bundle
        env:
          CBM_OUTPUT_DIR: _tmp/ci-bundle
          CBM_REQUIRE_LIVE_BUNDLE: "1"
        # test-backend-cov, not test-backend: both frontend pytest.ini files
        # declare --cov-fail-under=90 and every call site passed --no-cov, so
        # the declared gate never fired. Measured at adoption: backend 96%,
        # MCP server 92%.
        run: make test-backend-cov

  # The whole pytest tree — ~900 functions covering the emission contracts,
  # the reporting stack, the decomposer/recomposer, and the perf suites. None
  # of it ran in CI: `make test-units` was reachable only through `make test`,
  # which no job invoked, so the largest single body of tests in the
  # repository depended entirely on contributors running it locally.
  units:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit + contract suites
        run: make test-units

  # Language, Rust, vocabulary, offline-L4 and goal-ledger verifiers. 35+
  # verifier scripts that existed, passed, and were never executed by any
  # job — a per-language regression could land green.
  verifiers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Language-goal ledger + drift gate
        run: make check

      - name: Per-language, Rust, vocabulary and offline-L4 verifiers
        run: make test-vocab test-langs test-rust test-llm-offline test-docs

  # The root image built green and died on every invocation: the Dockerfile
  # hand-maintained a package list under `pip install --no-deps .`, the list
  # drifted from pyproject, and the image shipped without pydantic — which
  # codebase_mapper imports at CLI import time. No job built an image, so
  # `docker build` succeeding was mistaken for the image working.
  #
  # Building is not enough to catch that. This job RUNS the entrypoint.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the CLI image
        run: docker build -t codebase-mapper:ci .

      - name: The built image must actually start
        run: docker run --rm codebase-mapper:ci --help

      - name: The built image must map a real repository
        run: |
          mkdir -p _tmp/docker-out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/_tmp/docker-out:/work" \
            --entrypoint codebase-mapper codebase-mapper:ci \
            --repo /src/tests/fixtures/golden_repo --out /work/bundle
          test -f _tmp/docker-out/bundle/run_manifest.json

  # vitest never ran anywhere in CI, while vite.config.ts declares 90%
  # thresholds on all four metrics — another gate that only existed on paper.
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: frontend/ui
        run: npm ci

      - name: Type-check and build
        working-directory: frontend/ui
        run: npm run build

      - name: UI test suite
        working-directory: frontend/ui
        run: npm test -- --run
