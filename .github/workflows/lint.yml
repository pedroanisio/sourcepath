name: Lint

on:
  push:
  pull_request:

jobs:
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce import boundaries
        run: lint-imports

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/backend/requirements.txt
          python -m pip install -r frontend/mcp_server/requirements.txt

      # The executed half of the repo's Python type annotations; scope and
      # per-module policy live in pyproject.toml [tool.mypy].
      - name: Type-check (mypy)
        run: python -m mypy

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/backend/requirements.txt
          # pytest-cov: the backend pytest.ini passes --cov flags unconditionally
          python -m pip install pytest pytest-cov httpx

      # Golden-repo E2E: diffs the emitted bundle against a hand-written
      # expected projection — ground truth for the extractors, not
      # self-referential SHACL consistency.
      - name: Golden-repo extraction contract
        run: python tests/verify_golden_repo.py

      # Scope-A SHACL gate: fixture ABoxes conform; injected atScope /
      # dominant-value / provenance violations are rejected.
      - name: Dimension-shape SHACL contract
        run: python tests/verify_dimension_shapes.py

      # Backend perimeter: fail-closed auth and narrowed CORS.
      - name: Backend perimeter tests
        run: python -m pytest frontend/backend/tests/test_perimeter.py -q --no-cov

  # The drift suite guards every hand-mirrored contract (docs<->code, env
  # inventory, API field parity, report predicates, Rust-crate keys). It is
  # fast and fully offline; running it only via `make test` left every guard
  # dependent on contributor discipline (drift-risk-map H10).
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/backend/requirements.txt
          # pytest-cov: the backend pytest.ini passes --cov flags unconditionally
          python -m pip install pytest pytest-cov

      - name: Drift verifiers
        run: make test-drift

      # Live handler validation (drift-risk H4): emit a real bundle, then
      # drive every MCP handler + backend suite against it — output schemas
      # are validated on live payloads, not hand-written samples.
      - name: Generate live fixture bundle
        run: python scripts/run_l3.py --repo tests/fixtures/golden_repo --out _tmp/ci-bundle --backend hash

      - name: Backend + MCP suites against the live bundle
        run: make test-backend
