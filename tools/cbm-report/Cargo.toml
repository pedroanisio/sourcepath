[package]
name = "cbm-report"
version = "0.1.0"
edition = "2021"
description = "Renders a polished PDF report from a codebase-mapper bundle (streaming, multi-GB safe)"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
printpdf = "0.6"
ttf-parser = "0.20"

[profile.release]
opt-level = 3
lto = "thin"
