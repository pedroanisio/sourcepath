services:
  backend:
    build:
      # Context is the REPO ROOT (..) — required so the Dockerfile can
      # `COPY codebase_mapper ./codebase_mapper` and `COPY pyproject.toml`.
      # The Dockerfile is referenced explicitly because moving the
      # context up means it's no longer auto-discovered.
      context: ..
      dockerfile: frontend/backend/Dockerfile
      args:
        WITH_SBERT: "${WITH_SBERT:-0}"
    image: cbm-backend:${TAG:-latest}
    container_name: cbm-backend
    environment:
      # /data can be EITHER a single bundle directory (legacy single-bundle
      # mode, used when CBM_BUNDLE points at e.g. ../_tmp/usl-ng-core-map)
      # OR the parent directory containing multiple bundles (when CBM_BUNDLE
      # points at e.g. ../_tmp). The backend tries CBM_OUTPUT_DIR first and
      # falls through to enumerating CBM_BUNDLES_ROOT — setting both to
      # /data makes both layouts work.
      CBM_OUTPUT_DIR: /data
      CBM_BUNDLES_ROOT: /data
      # Explicit opt-in: the backend fails closed by default. Anonymous
      # access is safe HERE because the port is `expose`d only on the
      # compose-internal network and reached through the nginx front.
      # If you publish 8765 directly, remove this and set CBM_API_TOKEN.
      CBM_ALLOW_ANONYMOUS: "1"
    volumes:
      - "${CBM_BUNDLE:-../_tmp}:/data:ro"
    expose:
      - "8765"
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
    image: cbm-frontend:${TAG:-latest}
    container_name: cbm-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
